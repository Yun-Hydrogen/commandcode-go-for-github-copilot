name: Package VSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (semver, e.g. 0.2.5). Leave empty to use package.json.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: package-vsix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and upload VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply version override
        if: inputs.version != ''
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: npm version "$VERSION_INPUT" --no-git-tag-version --allow-same-version

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: commandcode-copilot-bridger-vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 30
