name: VSIX Package

run-name: VSIX • ${{ github.ref_name }} • ${{ github.event_name }}

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vsix-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Package extension
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: commandcode-copilot-bridger.vsix
          path: dist/*.vsix
          retention-days: 30

  publish:
    name: Publish to VS Code Marketplace
    environment: production
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$GITHUB_REF_NAME" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$PACKAGE_VERSION'."
            exit 1
          fi

      - name: Package extension
        run: npm run package

      - name: Publish extension
        run: npx vsce publish --packagePath dist/commandcode-copilot-bridger.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
